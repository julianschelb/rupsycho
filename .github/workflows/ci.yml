name: CI

# Quality gate for every push and pull request to main:
#
#   lint       ruff check and ruff format --check
#   typecheck  mypy on src/rupsycho with every model back-end installed
#   test       the offline test suite on Python 3.10-3.14, with a coverage gate
#   core       the bare package without any extra: tests that need an optional
#              dependency must skip cleanly instead of failing
#   build      sdist and wheel, twine check and an install smoke test of the wheel
#
# Tests that download real models (marker "integration") are not part of this
# workflow, see integration.yml. The Release workflow starts after a successful
# run of this one on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with the ruff-pre-commit rev in .pre-commit-config.yaml
  # (the lint job fails when the two pins disagree).
  RUFF_VERSION: "0.16.10"
  # The CPU-only PyTorch wheel avoids downloading ~2 GB of CUDA libraries.
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check that CI and pre-commit pin the same ruff version
        run: |
          hook=$(grep -A1 'astral-sh/ruff-pre-commit' .pre-commit-config.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          echo "CI: ${RUFF_VERSION}  pre-commit: ${hook:-<not found>}"
          if [ "${hook}" != "${RUFF_VERSION}" ]; then
            echo "::error::Update RUFF_VERSION in ci.yml and the ruff-pre-commit rev in .pre-commit-config.yaml together"
            exit 1
          fi

      - uses: astral-sh/ruff-action@v3
        with:
          args: check
          src: src/ tests/
          version: ${{ env.RUFF_VERSION }}

      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
          src: src/ tests/
          version: ${{ env.RUFF_VERSION }}

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # mypy sees the same installed back-ends as a developer with ".[dev,models]".
      - name: Install dependencies
        run: |
          pip install torch --index-url "$TORCH_INDEX_URL"
          pip install -e ".[dev,models]"

      - name: Run mypy
        run: mypy src/rupsycho/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # The offline suite must never download anything: a test that needs the
      # Hugging Face Hub belongs to the "integration" marker and fails here.
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      # Property-based tests use a fixed seed in CI, so that a run is reproducible and a
      # red build is never down to the luck of the draw. Run pytest locally to explore.
      PYTEST_ADDOPTS: --hypothesis-seed=0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install torch --index-url "$TORCH_INDEX_URL"
          pip install -e ".[dev,models,configurator]"

      # Integration tests (real model downloads) are deselected by default,
      # see addopts in pyproject.toml.
      - name: Run tests
        run: >-
          pytest --tb=short -q
          --cov --cov-report=term-missing:skip-covered --cov-report=xml
          --cov-fail-under=85

      - name: Upload coverage report
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  core:
    name: Core install without extras
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_ADDOPTS: --hypothesis-seed=0 # see the test job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Only the mandatory dependencies: no torch, transformers, provider SDKs,
      # streamlit, ... Tests that need one of them skip via pytest.importorskip.
      - name: Install the core package only
        run: pip install -e . pytest hypothesis

      - name: Run tests
        run: pytest -q -m 'not integration'

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      # Installs the wheel into an empty environment, so missing package data
      # (bundled examples, py.typed) and a broken `rupsycho` command are caught here.
      - name: Smoke-test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/rupsycho" --version
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'EOF'
          from importlib import resources

          import rupsycho as rup

          assert resources.files("rupsycho").joinpath("py.typed").is_file(), "py.typed missing"
          assert "bfi" in rup.list_examples(), "bundled examples missing"
          assert rup.load_example_config("bfi")["questionnaire"], "bundled example is empty"
          print("rupsycho", rup.__version__, "wheel OK")
          EOF
