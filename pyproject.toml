[project]
name = "rupsycho"
version = "0.1.0"
description = "R.U.Psycho: robust, unified and reproducible psychometric testing of language models."
authors = [
    {name = "Julian Schelb", email = "julian.schelb@uni-konstanz.de"},
    {name = "Orr Borin", email = "orr.borin@uni-konstanz.de"},
    {name = "David Garcia"},
    {name = "Andreas Spitz", email = "andreas.spitz@uni-konstanz.de"},
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["LLM", "psychometrics", "social science", "questionnaires", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic (>=2.9.0,<3.0.0)",
    "pandas (>=2.1.1,<3.0.0)",
    "numpy (>=1.26.0,<3.0.0)",
    "tabulate (>=0.9.0,<1.0.0)",
    "tqdm (>=4.64.0,<5.0.0)",
    "aiofiles (>=24.1.0)",
    "langchain-core (>=0.3.78,<0.4.0)",
]

[project.optional-dependencies]
# Local Hugging Face models, remote endpoints and the model-based parsers
huggingface = [
    "torch (>=2.2.0,<3.0.0)",
    "transformers (>=4.40.0,<5.0.0)",
    "accelerate (>=0.25.0)",
    "sentencepiece (>=0.2.0)",
    "langchain-huggingface (>=0.3.1,<0.4.0)",
]
openai = ["langchain-openai (>=0.3.35,<0.4.0)"]
ollama = ["langchain-ollama (>=0.3.10,<0.4.0)"]
google = ["langchain-google-genai (>=2.1.12,<3.0.0)"]
deepseek = ["langchain-deepseek (>=0.1.4,<1.0.0)"]
# Every supported model back-end
models = [
    "torch (>=2.2.0,<3.0.0)",
    "transformers (>=4.40.0,<5.0.0)",
    "accelerate (>=0.25.0)",
    "sentencepiece (>=0.2.0)",
    "langchain-huggingface (>=0.3.1,<0.4.0)",
    "langchain-openai (>=0.3.35,<0.4.0)",
    "langchain-ollama (>=0.3.10,<0.4.0)",
    "langchain-google-genai (>=2.1.12,<3.0.0)",
    "langchain-deepseek (>=0.1.4,<1.0.0)",
]
configurator = [
    "streamlit (>=1.40.2,<2.0.0)",
    "pypdf (>=5.1.0,<7.0.0)",
    "openai (>=1.104.2,<2.0.0)",
    "langchain-openai (>=0.3.35,<0.4.0)",
]
notebook = [
    "ipywidgets (>=8.1.5,<9.0.0)",
]
quantization = [
    "bitsandbytes (>=0.43.0)",
]
all = [
    "torch (>=2.2.0,<3.0.0)",
    "transformers (>=4.40.0,<5.0.0)",
    "accelerate (>=0.25.0)",
    "sentencepiece (>=0.2.0)",
    "langchain-huggingface (>=0.3.1,<0.4.0)",
    "langchain-openai (>=0.3.35,<0.4.0)",
    "langchain-ollama (>=0.3.10,<0.4.0)",
    "langchain-google-genai (>=2.1.12,<3.0.0)",
    "langchain-deepseek (>=0.1.4,<1.0.0)",
    "streamlit (>=1.40.2,<2.0.0)",
    "pypdf (>=5.1.0,<7.0.0)",
    "openai (>=1.104.2,<2.0.0)",
    "ipywidgets (>=8.1.5,<9.0.0)",
    "bitsandbytes (>=0.43.0) ; sys_platform != 'darwin'",
]
test = [
    "pytest (>=8.0.0,<10.0.0)",
    "pytest-cov (>=4.0.0)",
    "hypothesis (>=6.100.0)",
]
docs = [
    "mkdocs (>=1.6.0,<2.0.0)",
    "mkdocs-material (>=9.0.0)",
    "mkdocstrings[python] (>=0.24.0)",
]
dev = [
    "pytest (>=8.0.0,<10.0.0)",
    "pytest-cov (>=4.0.0)",
    "hypothesis (>=6.100.0)",
    "mkdocs (>=1.6.0,<2.0.0)",
    "mkdocs-material (>=9.0.0)",
    "mkdocstrings[python] (>=0.24.0)",
    "poethepoet (>=0.24.0)",
    "ruff (>=0.8.0)",
    "mypy (>=1.10.0)",
    "pandas-stubs",
    "types-tqdm (>=4.66.0)",
    "types-aiofiles",
    "types-tabulate",
    "pre-commit (>=3.5.0)",
    "build (>=1.0.0)",
    "python-semantic-release (>=9.0.0)",
    "nbclient (>=0.10.0)",
    "nbformat (>=5.9.0)",
    "ipykernel (>=6.29.0)",
]

[project.urls]
Homepage = "https://github.com/julianschelb/rupsycho"
Documentation = "https://julianschelb.github.io/rupsycho/"
Repository = "https://github.com/julianschelb/rupsycho"
Issues = "https://github.com/julianschelb/rupsycho/issues"
Changelog = "https://github.com/julianschelb/rupsycho/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2503.10229"

[project.scripts]
rupsycho = "rupsycho.cli:main"
rup-configurator = "rupsycho_configurator.launcher:main"

[tool.poetry]
packages = [
    {include = "rupsycho", from = "src"},
    {include = "rupsycho_configurator", from = "src"},
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: tests that download and run real models (deselected by default; run with -m integration)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:Models of type .* cannot be seeded:UserWarning",
]

[tool.coverage.run]
source = ["rupsycho"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.poe.tasks]
test = "pytest"
test-cov = "pytest --cov --cov-report=term-missing"
test-integration = "pytest -m integration"
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
format-check = "ruff format --check src/ tests/"
typecheck = "mypy src/rupsycho/"
docs = "mkdocs serve"
docs-build = "mkdocs build --strict"
docs-deploy = "mkdocs gh-deploy --force"
bench = "python benchmarks/bench_run_loop.py"
check = ["lint", "format-check", "typecheck", "test"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108", "B905", "B006"]

[tool.ruff.lint.isort]
known-first-party = ["rupsycho", "rupsycho_configurator"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"src/**/__init__.py" = ["F401", "F403"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
exclude = ["tests/", "examples/"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/rupsycho/__init__.py:__version__"]
build_command = "pip install build && python -m build"
commit_message = "chore(release): v{version} [skip ci]"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
exclude_commit_patterns = ["chore\\(release\\):"]

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
