site_name: R.U.Psycho
site_description: Robust, unified and reproducible psychometric testing of language models.
site_url: https://julianschelb.github.io/rupsycho/
repo_url: https://github.com/julianschelb/rupsycho
repo_name: julianschelb/rupsycho

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/julianschelb/rupsycho
  generator: false

copyright: |
  <a href="https://arxiv.org/abs/2503.10229">Schelb, Borin, Garcia &amp; Spitz (2025)</a> | MIT License

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_toc_entry: true
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_bases: false
            show_if_no_docstring: false
            filters: ["!^_"]
            group_by_category: false
            members_order: source
            show_category_heading: false
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 60
            docstring_style: google
            docstring_section_style: spacy
            merge_init_into_class: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - Configuration Reference: configuration.md
  - Tutorials:
    - Running Experiments: tutorials/running-experiments.md
    - Models: tutorials/models.md
    - Parsing & Postprocessing: tutorials/postprocessing.md
    - Callbacks: tutorials/callbacks.md
    - Configurator App: tutorials/configurator.md
  - Examples: examples.md
  - API Reference:
    - Overview: api/index.md
    - Experiment: api/experiment.md
    - Loading: api/loading.md
    - Data Models: api/models.md
    - Parsers: api/parsers.md
    - Callbacks: api/callbacks.md
    - Postprocessing: api/postprocessing.md
  - Development: development.md
  - Changelog: changelog.md
