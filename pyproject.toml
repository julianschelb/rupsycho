[tool.poetry]
name = "RUPsycho"
version = "0.1.0"
description = "RUPsycho is a Python package designed for the application of large language models (LLMs) in social science research"
authors = ["Julian Schelb <julian.schelb@uni-konstanz.de>", "Orr Borin <orr.borin@uni-konstanz.de>", "Andreas Spitz <andreas.spitz@uni-konstanz.de>"]
readme = "README.md"
license = "MIT" 
homepage = "https://github.com/julianschelb/rupsycho"
repository = "https://github.com/julianschelb/rupsycho"
documentation = "https://julianschelb.github.io/rupsycho/"
keywords = ["LLM", "social science", "psychology", "machine learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
packages = [{ include = "rupsycho", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
tabulate = "^0.9.0"
pydantic = "^2.5.2"
transformers = "<4.57.0"
openai = "^1.84.0"
torch = "^2.1.2"
accelerate = "^0.25.0"
sentencepiece = "^0.1.99"
protobuf = "^4.25.1"
langchain = "^0.3.25"
langchain-core = "^0.3.75"
bitsandbytes = "^0.41.3"
langchain-openai = "^0.3.19"
langchain-huggingface = "^0.3.0"
aiofiles = "^24.1.0"
ipywidgets = "^8.1.5"
pandas = "^2.3.0"
nltk = "^3.9.1"
langchain-ollama = "^0.3.3"
langchain-google-genai = "^2.1.5"
langchain-deepseek = "^0.1.3"
dotenv = "^0.9.9"
scipy = "^1.16.2"
num2words = "^0.5.14"

[tool.poetry.group.dev.dependencies]
sphinx = "^8.1.3"
sphinx-rtd-theme = "^3.0.2"
sphinx-copybutton = "^0.5.2"
pytest = "^8.3.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
