name: Release

# Automated releases from Conventional Commits:
#   1. CI passes on main (workflow_run) or the workflow is started by hand
#   2. python-semantic-release inspects the commits since the last tag, bumps the
#      version in pyproject.toml and src/rupsycho/__init__.py, updates
#      CHANGELOG.md, commits, tags vX.Y.Z and creates the GitHub release
#   3. (optional) the distribution is published to PyPI via Trusted Publishing
#
# No API tokens are stored anywhere: the workflow uses the built-in GITHUB_TOKEN
# and PyPI's OIDC trust for the "pypi" environment.
#
# Enabling the PyPI upload (one-time setup, details in DEVELOPMENT.md):
#   1. PyPI -> Your account -> Publishing -> add a (pending) trusted publisher for the
#      project "rupsycho": owner julianschelb, repository rupsycho, workflow
#      release.yml, environment pypi
#   2. GitHub -> Settings -> Environments -> create the environment "pypi"
#      (optionally require a reviewer and restrict deployments to main)
#   3. GitHub -> Settings -> Secrets and variables -> Actions -> Variables ->
#      set PUBLISH_PYPI=true
# Until PUBLISH_PYPI is "true" the GitHub release and tag are still created, only
# the upload to PyPI is skipped.
#
# The automatic path (after every green CI run on main) is opt-in: set the repository variable
# AUTO_RELEASE=true. Releasing pushes a version-bump commit and a tag to main, which the
# branch ruleset of this repository only allows for administrators, so the workflow needs a
# token that may bypass it: create a fine-grained personal access token of an administrator
# (Contents: read and write) and store it as the secret RELEASE_TOKEN. Without it the
# built-in GITHUB_TOKEN is used, which works for repositories without such a ruleset.
#
# Manual runs: "Run workflow" releases like the automatic path. With the input
# publish_current the checked-out version is built and published as-is, without
# a version bump (for a version that is already tagged, e.g. the initial v0.1.0).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_current:
        description: >-
          Publish the checked-out version as-is (no version bump). Start the run from the
          matching vX.Y.Z tag; the PyPI upload still needs the PUBLISH_PYPI variable.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only releases from a green CI run on a push to main. Runs of CI that were
    # triggered by pull requests (even from a fork branch named "main") never release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_RELEASE == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    concurrency: release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.flag.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          # a token that may push to the protected branch (see the header), else the default one
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The major version of python-semantic-release is capped so that a new major
      # cannot break the release pipeline unnoticed.
      - name: Install release tooling
        run: pip install "python-semantic-release>=9.0.0,<11" build twine

      - name: Run semantic-release
        id: semrel
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_current) }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          semantic-release version
          # semantic-release only builds dist/ when it created a new release
          if compgen -G "dist/*.whl" >/dev/null || compgen -G "dist/*.tar.gz" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the current version (manual publish, no bump)
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_current }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="v${VERSION}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} does not exist; tag the release first"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-list -n 1 "${TAG}")" ]; then
            echo "::error::The checked-out commit is not the one tagged ${TAG}; start the workflow from that tag (Use workflow from -> Tags -> ${TAG})"
            exit 1
          fi
          python -m build
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Resolve release flag
        id: flag
        env:
          RELEASED: ${{ steps.semrel.outputs.released || steps.manual.outputs.released || 'false' }}
        run: echo "released=${RELEASED}" >> "$GITHUB_OUTPUT"

      - name: Check distribution
        if: steps.flag.outputs.released == 'true'
        run: twine check dist/*

      - name: Publish GitHub release assets
        if: steps.semrel.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: semantic-release publish

      - name: Upload dist artifacts
        if: steps.flag.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: release
    # The repository variable PUBLISH_PYPI is the switch for the upload.
    if: needs.release.outputs.released == 'true' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/rupsycho
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
