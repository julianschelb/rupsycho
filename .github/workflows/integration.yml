name: Integration

# Tests marked "integration" download small real models from the Hugging Face Hub
# and run them on the CPU. They are slow and need the network, so they are not
# part of CI: run them by hand (Actions -> Integration -> Run workflow) or let the
# weekly schedule catch breakage from new versions of transformers, the hub or the
# models themselves.

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Optional pytest -k expression to run only some integration tests"
        type: string
        required: false
        default: ""
  schedule:
    - cron: "23 4 * * 1" # Mondays, 04:23 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The CPU-only PyTorch wheel avoids downloading ~2 GB of CUDA libraries.
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  integration:
    name: Integration tests (real models)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install torch --index-url "$TORCH_INDEX_URL"
          pip install -e ".[dev,models]"

      # A new key is saved whenever the tests (and with them the models they use)
      # change; the restore key reuses the previous download in that case.
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('tests/**/*.py', 'tests/data/**') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Run integration tests
        env:
          # Optional: lets the tests use gated models and avoids hub rate limits.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KEYWORD: ${{ inputs.keyword }}
        run: pytest -m integration --tb=short -v ${KEYWORD:+-k "$KEYWORD"}
